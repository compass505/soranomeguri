<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7fa8c9">
<title>そらのめぐり</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="title-open">
<div id="app">
  <section id="title-screen" class="title-screen" aria-labelledby="title-logo">
    <div class="title-sky" aria-hidden="true">
      <span class="title-sun"></span>
      <span class="title-cloud title-cloud-a"></span>
      <span class="title-cloud title-cloud-b"></span>
      <span class="title-cloud title-cloud-c"></span>
      <span class="title-hills"></span>
    </div>

    <div class="title-copy">
      <p class="title-kicker"><span>二十四節気</span><i></i><span>十の天気</span></p>
      <div class="season-ring" aria-hidden="true"><i></i></div>
      <h1 id="title-logo"><span>そらの</span><strong>めぐり</strong></h1>
      <p class="title-tagline">空をめぐらせ、天気の子と暮らす。</p>
      <button id="title-start" class="title-start" type="button">
        <span class="title-action">空をひらく</span>
        <span class="title-arrow" aria-hidden="true">→</span>
      </button>
    </div>

    <p class="title-guide">
      <span>気温</span><i></i><span>湿り</span><i></i><span>気圧</span><i></i><span>風</span>
      <small>四つのつまみで、今日の空をつくる</small>
    </p>
  </section>

  <canvas id="stage"></canvas>

  <div id="hud">
    <div id="date"><span id="sekki">立春</span><span id="dayno"></span></div>
    <button id="record-open" type="button" disabled>めぐり</button>
    <div id="weather"><span id="wname">—</span></div>
  </div>

  <section id="record-screen" class="record-screen" aria-labelledby="record-title" aria-hidden="true" hidden>
    <header class="record-header">
      <button id="record-close" type="button">←もどる</button>
      <h1 id="record-title">めぐりの記録</h1>
      <span aria-hidden="true"></span>
    </header>
    <main class="record-main">
      <section class="record-overview" aria-label="実りの環">
        <div id="record-ring" class="record-ring"></div>
        <section class="record-outside-section" aria-labelledby="record-outside-title">
          <h2 id="record-outside-title">環の外</h2>
          <div id="record-outside" class="record-outside"></div>
        </section>
      </section>
      <article id="record-sheet" class="record-sheet" aria-live="polite" hidden></article>
    </main>
  </section>

  <div id="feed"></div>

  <div id="panel">
    <div class="dials">
      <label class="dial" data-k="t">
        <span class="name">気温</span>
        <span class="range-wrap"><span class="range-track" aria-hidden="true"><i id="r-t"></i></span><input type="range" id="d-t" min="-20" max="40" step="0.1"></span>
        <span class="val" id="v-t"></span>
      </label>
      <label class="dial" data-k="w">
        <span class="name">湿り</span>
        <span class="range-wrap"><span class="range-track" aria-hidden="true"><i id="r-w"></i></span><input type="range" id="d-w" min="0" max="100" step="0.5"></span>
        <span class="val" id="v-w"></span>
      </label>
      <label class="dial" data-k="p">
        <span class="name">気圧</span>
        <span class="range-wrap"><span class="range-track" aria-hidden="true"><i id="r-p"></i></span><input type="range" id="d-p" min="960" max="1040" step="0.5"></span>
        <span class="val" id="v-p"></span>
      </label>
      <label class="dial" data-k="v">
        <span class="name">風</span>
        <span class="range-wrap"><span class="range-track" aria-hidden="true"><i id="r-v"></i></span><input type="range" id="d-v" min="0" max="35" step="0.1"></span>
        <span class="val" id="v-v"></span>
      </label>
    </div>

    <div id="gauges">
      <div class="g"><span>雲</span><div class="bar"><i id="g-cloud"></i></div></div>
      <div class="g"><span>湿度</span><div class="bar"><i id="g-rh"></i></div></div>
      <div class="g"><span>上昇気流</span><div class="bar"><i id="g-u"></i></div></div>
    </div>

    <div id="bag"></div>
  </div>

  <div id="dev-panel" hidden>
    <p id="dev-now"></p>
    <div class="dev-row">
      <input type="number" id="dev-days" min="1" step="1" value="1">
      <button id="dev-advance" type="button">日を進める</button>
    </div>
    <div class="dev-row">
      <select id="dev-sekki"></select>
      <button id="dev-jump" type="button">その節気へ</button>
    </div>
    <button id="dev-reset" type="button">早送り解除</button>
  </div>
</div>
<script type="module" src="js/game.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
